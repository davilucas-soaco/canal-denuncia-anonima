services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: canal-denuncia-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SoAcoCanal_Dev2026!"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - canal_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P SoAcoCanal_Dev2026! -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  canal_sql_data:
